<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaspa Explorer | BlockDAG Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛓</text></svg>">
    <link rel="stylesheet" href="assets/css/kaspa-explorer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .landing-hero {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        .landing-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .landing-subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }
        
        .landing-search {
            margin-bottom: 2rem;
        }
        
        .explore-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            text-decoration: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        
        .explore-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                    <span class="logo-text">Kaspa<span class="logo-accent">Scan</span></span>
                </div>
                <div class="network-status">
                    <div class="status-indicator"></div>
                    <span class="status-text">Network Active</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Landing Content -->
    <div class="landing-container">
        <div class="landing-hero">
            <h1 class="landing-title">Kaspa BlockDAG Explorer</h1>
            <p class="landing-subtitle">Real-time network data & transaction explorer</p>
            
            <!-- Search Bar -->
            <div class="search-container landing-search">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="Search by Address / Tx Hash / Block Hash"
                        id="main-search"
                        autocomplete="off"
                    >
                    <button class="search-btn" id="search-btn">
                        <span>Search</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>

            <!-- Explore Stats Link -->
            <a href="kaspa-explorer.html" class="explore-link">
                <i class="fas fa-chart-line"></i>
                <span>Explore Network Stats</span>
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>KaspaScan</h4>
                    <p>Professional BlockDAG Explorer</p>
                </div>
                <div class="footer-section">
                    <h4>Network</h4>
                    <p id="footer-status">Active</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Minimal search functionality
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('main-search');
        
        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            // Redirect to full explorer with search query
            window.location.href = `kaspa-explorer.html?search=${encodeURIComponent(query)}`;
        }
        
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
