<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaspa Transactions - Live Updates</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
        }

        select, input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #4ade80;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 0, 0, 0.2);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tbody tr {
            transition: background 0.3s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .hash {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #4ade80;
        }

        .amount {
            font-weight: 600;
            color: #fbbf24;
        }

        .new-row {
            animation: highlightRow 2s;
        }

        @keyframes highlightRow {
            0% { background: rgba(74, 222, 128, 0.3); }
            100% { background: transparent; }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-exchange-alt"></i>
                Live Kaspa Transactions
            </h1>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>Live Updates Every 10s</span>
            </div>
            <p style="margin-top: 10px; opacity: 0.8;">Real-time transaction monitoring</p>
        </div>

        <a href="kaspa-explorerv5.21.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Explorer
        </a>

        <div class="stats-bar" style="margin-top: 20px;">
            <div class="stat-item">
                <div class="stat-label">Total Displayed</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Average Amount</div>
                <div class="stat-value" id="avg-amount">0 KAS</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="total-volume">0 KAS</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Next Update</div>
                <div class="stat-value" id="countdown">10s</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="limit">Show:</label>
                <select id="limit">
                    <option value="25">25 Transactions</option>
                    <option value="50" selected>50 Transactions</option>
                    <option value="100">100 Transactions</option>
                    <option value="200">200 Transactions</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filter">Filter:</label>
                <input type="text" id="filter" placeholder="Search tx hash or address...">
            </div>
            <div class="control-group">
                <label for="sort">Sort by:</label>
                <select id="sort">
                    <option value="time-desc">Newest First</option>
                    <option value="time-asc">Oldest First</option>
                    <option value="amount-desc">Highest Amount</option>
                    <option value="amount-asc">Lowest Amount</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>TX Hash</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Amount</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="transactions-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
                            <br>Loading transactions...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let transactions = [];
        let refreshInterval = null;
        let countdownInterval = null;
        let secondsLeft = 10;

        // Mock transaction generator
        function generateMockHash(prefix = '') {
            const chars = '0123456789abcdef';
            let hash = prefix;
            for (let i = 0; i < (64 - prefix.length); i++) {
                hash += chars[Math.floor(Math.random() * chars.length)];
            }
            return hash;
        }

        function generateMockAddress() {
            return 'kaspa:' + generateMockHash('qq').substring(0, 42);
        }

        function generateMockTransactions(count) {
            const txs = [];
            const now = Date.now();
            
            for (let i = 0; i < count; i++) {
                const amount = (Math.random() * 10000 + 1).toFixed(2);
                const timestamp = now - (i * 1000); // 1 second apart
                
                txs.push({
                    hash: generateMockHash(),
                    from: generateMockAddress(),
                    to: generateMockAddress(),
                    amount: parseFloat(amount),
                    timestamp: timestamp
                });
            }
            
            return txs;
        }

        function formatTime(timestamp) {
            const now = Date.now();
            const diff = Math.floor((now - timestamp) / 1000);
            
            if (diff < 60) return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return new Date(timestamp).toLocaleString();
        }

        function updateStats() {
            const limit = parseInt(document.getElementById('limit').value);
            const displayedTxs = transactions.slice(0, limit);
            
            document.getElementById('total-count').textContent = displayedTxs.length;
            
            if (displayedTxs.length > 0) {
                const totalAmount = displayedTxs.reduce((sum, tx) => sum + tx.amount, 0);
                const avgAmount = totalAmount / displayedTxs.length;
                
                document.getElementById('avg-amount').textContent = avgAmount.toFixed(2) + ' KAS';
                document.getElementById('total-volume').textContent = totalAmount.toFixed(2) + ' KAS';
            }
        }

        function renderTransactions() {
            const tbody = document.getElementById('transactions-body');
            const limit = parseInt(document.getElementById('limit').value);
            const filter = document.getElementById('filter').value.toLowerCase();
            const sort = document.getElementById('sort').value;
            
            let filteredTxs = transactions.filter(tx => {
                if (!filter) return true;
                return tx.hash.includes(filter) || 
                       tx.from.includes(filter) || 
                       tx.to.includes(filter);
            });
            
            // Sort
            switch(sort) {
                case 'time-asc':
                    filteredTxs.sort((a, b) => a.timestamp - b.timestamp);
                    break;
                case 'amount-desc':
                    filteredTxs.sort((a, b) => b.amount - a.amount);
                    break;
                case 'amount-asc':
                    filteredTxs.sort((a, b) => a.amount - b.amount);
                    break;
                default: // time-desc
                    filteredTxs.sort((a, b) => b.timestamp - a.timestamp);
            }
            
            const displayedTxs = filteredTxs.slice(0, limit);
            
            tbody.innerHTML = displayedTxs.map((tx, index) => `
                <tr class="${index < 5 ? 'new-row' : ''}">
                    <td class="hash" title="${tx.hash}">${tx.hash.substring(0, 16)}...${tx.hash.substring(48)}</td>
                    <td class="hash" title="${tx.from}">${tx.from.substring(0, 20)}...</td>
                    <td class="hash" title="${tx.to}">${tx.to.substring(0, 20)}...</td>
                    <td class="amount">${tx.amount.toFixed(2)} KAS</td>
                    <td>${formatTime(tx.timestamp)}</td>
                </tr>
            `).join('');
            
            updateStats();
        }

        function fetchTransactions() {
            const limit = parseInt(document.getElementById('limit').value);
            const newTxs = generateMockTransactions(5); // 5 new transactions every update
            
            // Add new transactions to the beginning
            transactions = [...newTxs, ...transactions].slice(0, limit * 2); // Keep double the limit
            
            renderTransactions();
            resetCountdown();
        }

        function resetCountdown() {
            secondsLeft = 10;
            updateCountdown();
        }

        function updateCountdown() {
            document.getElementById('countdown').textContent = secondsLeft + 's';
            secondsLeft--;
            
            if (secondsLeft < 0) {
                fetchTransactions();
            }
        }

        // Event listeners
        document.getElementById('limit').addEventListener('change', renderTransactions);
        document.getElementById('filter').addEventListener('input', renderTransactions);
        document.getElementById('sort').addEventListener('change', renderTransactions);

        // Initialize
        fetchTransactions();
        
        // Set up refresh (every 10 seconds)
        refreshInterval = setInterval(fetchTransactions, 10000);
        countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
