<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassik | Kaspa BlockDAG Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛓</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-blue: #0ea5e9;
            --accent-purple: #8b5cf6;
            --border-color: rgba(148, 163, 184, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .explorer-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .explorer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            padding: 6rem 0 4rem;
            text-align: center;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* ===== SEARCH ===== */
        .search-section {
            max-width: 800px;
            margin: 0 auto 4rem;
            padding: 0 2rem;
        }

        .search-container {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            transition: border-color 0.2s ease;
        }

        .search-container:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 1rem 1.5rem;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        /* ===== RESULTS ===== */
        .results-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .result-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .result-type {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .result-data {
            display: grid;
            gap: 0.75rem;
        }

        .result-row {
            display: flex;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.5rem;
            align-items: flex-start;
        }

        .result-label {
            flex: 0 0 140px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            flex: 1;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        /* ===== LOADING & EMPTY STATES ===== */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
            color: var(--accent-blue);
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-error {
            border-left: 4px solid #ef4444;
        }

        .toast-success {
            border-left: 4px solid #10b981;
        }

        .toast-info {
            border-left: 4px solid #3b82f6;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .nav {
                gap: 1rem;
            }

            .search-btn {
                padding: 0.75rem 1.5rem;
            }

            .result-row {
                flex-direction: column;
                gap: 0.5rem;
            }

            .result-label {
                flex: none;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <i class="fas fa-cubes"></i> Klassik
                </a>
                <nav class="nav">
                    <a href="#" class="nav-link">Network</a>
                    <a href="#" class="nav-link">Blocks</a>
                    <a href="#" class="nav-link">Transactions</a>
                    <a href="sacrifice.html" class="explorer-btn">
                        <i class="fas fa-compass"></i> Explorer
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Kaspa BlockDAG Explorer</h1>
            <p class="hero-subtitle">
                Lightning-fast blockchain exploration. Search addresses, transactions, and blocks instantly.
            </p>
        </div>
    </section>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="search-input"
                placeholder="Search by Address / Transaction Hash / Block Hash"
                autocomplete="off"
            >
            <button class="search-btn" id="search-btn">
                <span>Search</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </section>

    <!-- Results Section -->
    <section class="results-section" id="results-section">
        <!-- Results will be inserted here -->
    </section>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // ===== CONFIGURATION =====
        const KASPA_API = 'https://api.kaspa.org';

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== SEARCH FUNCTIONALITY =====
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsSection = document.getElementById('results-section');

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                showToast('Please enter a search query', 'error');
                return;
            }

            // Show loading
            resultsSection.innerHTML = `
                <div class="loading">
                    <i class="fas fa-circle-notch"></i>
                    <p>Searching blockchain...</p>
                </div>
            `;

            try {
                let result = null;
                let type = null;

                // Determine type and search
                if (query.startsWith('kaspa:')) {
                    // Address search
                    type = 'address';
                    result = await searchAddress(query);
                } else if (query.length === 64) {
                    // Could be transaction or block hash
                    try {
                        result = await searchTransaction(query);
                        type = 'transaction';
                    } catch {
                        result = await searchBlock(query);
                        type = 'block';
                    }
                } else {
                    showToast('Invalid query format', 'error');
                    resultsSection.innerHTML = '';
                    return;
                }

                if (result) {
                    displayResult(result, type);
                    showToast('Search successful!', 'success');
                } else {
                    showToast('No results found', 'error');
                    resultsSection.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <p>No results found for "${query}"</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Search error:', error);
                showToast('Search failed: ' + error.message, 'error');
                resultsSection.innerHTML = '';
            }
        }

        // ===== API CALLS =====
        async function searchAddress(address) {
            // Get balance
            const balanceRes = await fetch(`${KASPA_API}/addresses/${address}/balance`);
            if (!balanceRes.ok) throw new Error('Address not found');
            const balanceData = await balanceRes.json();
            
            // Get transaction count
            const txCountRes = await fetch(`${KASPA_API}/addresses/${address}/transactions-count`);
            const txCountData = txCountRes.ok ? await txCountRes.json() : { total: 0 };
            
            // Get recent transactions
            const txRes = await fetch(`${KASPA_API}/addresses/${address}/full-transactions?limit=10&offset=0`);
            const txData = txRes.ok ? await txRes.json() : [];
            
            // Get price for USD conversion
            const priceRes = await fetch(`${KASPA_API}/info/price`);
            const priceData = priceRes.ok ? await priceRes.json() : { price: 0 };
            
            // Convert balance from sompi to KAS (1 KAS = 100000000 sompi)
            const balanceKAS = parseFloat(balanceData.balance || 0) / 100000000;
            const balanceUSD = balanceKAS * (priceData.price || 0);
            
            return {
                address: address,
                balance: balanceKAS,
                balanceUSD: balanceUSD,
                transactionCount: txCountData.total || 0,
                transactions: txData,
                kasPrice: priceData.price || 0
            };
        }

        async function searchTransaction(hash) {
            const res = await fetch(`${KASPA_API}/transactions/${hash}`);
            if (!res.ok) throw new Error('Transaction not found');
            return await res.json();
        }

        async function searchBlock(hash) {
            const res = await fetch(`${KASPA_API}/blocks/${hash}`);
            if (!res.ok) throw new Error('Block not found');
            return await res.json();
        }

        // ===== DISPLAY RESULTS =====
        function formatKAS(amount) {
            const parts = amount.toFixed(8).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }
        
        function formatUSD(amount) {
            return '$' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function shortenAddress(addr) {
            if (!addr) return 'N/A';
            const prefix = addr.substring(0, 13); // kaspa:qqht933
            const suffix = addr.substring(addr.length - 8); // lk92gr2f
            return `${prefix}...${suffix}`;
        }
        
        function displayResult(data, type) {
            let html = '';

            if (type === 'address') {
                // Build transactions table
                let txTable = '';
                if (data.transactions && data.transactions.length > 0) {
                    txTable = `
                        <div style="margin-top: 2rem;">
                            <h3 style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.1rem;">Recent Transactions</h3>
                            <div style="overflow-x: auto;">
                                <table style="width: 100%; border-collapse: collapse;">
                                    <thead>
                                        <tr style="border-bottom: 2px solid var(--border-color);">
                                            <th style="text-align: left; padding: 0.75rem; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Timestamp</th>
                                            <th style="text-align: left; padding: 0.75rem; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">TX Hash</th>
                                            <th style="text-align: right; padding: 0.75rem; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Amount</th>
                                            <th style="text-align: center; padding: 0.75rem; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.transactions.map(tx => {
                                            const amount = tx.outputs?.reduce((sum, out) => sum + (parseFloat(out.amount) || 0), 0) || 0;
                                            const amountKAS = amount / 100000000;
                                            const timestamp = tx.block_time ? new Date(tx.block_time * 1000).toLocaleDateString() : 'Pending';
                                            const txHash = tx.transaction_id || 'N/A';
                                            const shortHash = txHash.substring(0, 8) + '...' + txHash.substring(txHash.length - 8);
                                            return `
                                                <tr style="border-bottom: 1px solid var(--border-color);">
                                                    <td style="padding: 0.75rem; color: var(--text-secondary); font-size: 0.9rem;">${timestamp}</td>
                                                    <td style="padding: 0.75rem; font-family: monospace; font-size: 0.85rem;">${shortHash}</td>
                                                    <td style="padding: 0.75rem; text-align: right; font-weight: 600; color: var(--accent-blue);">${formatKAS(amountKAS)} KAS</td>
                                                    <td style="padding: 0.75rem; text-align: center;">${tx.is_accepted ? '<span style="color: #10b981;">✅</span>' : '<span style="color: #f59e0b;">⏳</span>'}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
                
                html = `
                    <div class="result-card">
                        <span class="result-type"><i class="fas fa-wallet"></i> Address</span>
                        <h2 class="result-title">Address Details</h2>
                        <div class="result-data">
                            <div class="result-row">
                                <div class="result-label">Balance</div>
                                <div class="result-value" style="font-size: 1.5rem; font-weight: 700; color: var(--accent-blue);">
                                    ${formatKAS(data.balance)} KAS
                                    <div style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 400; margin-top: 0.25rem;">
                                        ${formatUSD(data.balanceUSD)}
                                    </div>
                                </div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Address</div>
                                <div class="result-value" style="font-size: 0.85rem;">
                                    ${shortenAddress(data.address)}
                                    <button onclick="navigator.clipboard.writeText('${data.address}')" style="margin-left: 0.5rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.75rem;">
                                        <i class="fas fa-copy"></i> Copy
                                    </button>
                                </div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Transactions</div>
                                <div class="result-value">${data.transactionCount}</div>
                            </div>
                        </div>
                        ${txTable}
                    </div>
                `;
            } else if (type === 'transaction') {
                const totalOutput = data.outputs?.reduce((sum, out) => sum + (parseFloat(out.amount) || 0), 0) || 0;
                const amountKAS = totalOutput / 100000000;
                html = `
                    <div class="result-card">
                        <span class="result-type"><i class="fas fa-exchange-alt"></i> Transaction</span>
                        <h2 class="result-title">Transaction Details</h2>
                        <div class="result-data">
                            <div class="result-row">
                                <div class="result-label">Amount</div>
                                <div class="result-value" style="font-size: 1.3rem; font-weight: 700; color: var(--accent-blue);">
                                    ${formatKAS(amountKAS)} KAS
                                </div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Hash</div>
                                <div class="result-value" style="font-size: 0.85rem;">${shortenAddress(data.transaction_id || 'N/A')}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Block Hash</div>
                                <div class="result-value" style="font-size: 0.85rem;">${data.block_hash?.[0] ? shortenAddress(data.block_hash[0]) : 'Pending'}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Inputs</div>
                                <div class="result-value">${data.inputs?.length || 0}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Outputs</div>
                                <div class="result-value">${data.outputs?.length || 0}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Status</div>
                                <div class="result-value">${data.is_accepted ? '<span style="color: #10b981;">✅ Confirmed</span>' : '<span style="color: #f59e0b;">⏳ Pending</span>'}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type === 'block') {
                html = `
                    <div class="result-card">
                        <span class="result-type"><i class="fas fa-cube"></i> Block</span>
                        <h2 class="result-title">Block Details</h2>
                        <div class="result-data">
                            <div class="result-row">
                                <div class="result-label">Hash</div>
                                <div class="result-value" style="font-size: 0.85rem;">${shortenAddress(data.hash || 'N/A')}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Blue Score</div>
                                <div class="result-value" style="font-size: 1.3rem; font-weight: 700; color: var(--accent-blue);">
                                    ${(data.header?.blue_score || 0).toLocaleString()}
                                </div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Timestamp</div>
                                <div class="result-value">${data.header?.timestamp ? new Date(parseInt(data.header.timestamp)).toLocaleString() : 'N/A'}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Transactions</div>
                                <div class="result-value">${data.transactions?.length || 0}</div>
                            </div>
                            <div class="result-row">
                                <div class="result-label">Parents</div>
                                <div class="result-value">${data.header?.parents?.[0]?.parent_hashes?.length || 0}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            resultsSection.innerHTML = html;
        }

        // ===== EVENT LISTENERS =====
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // ===== AUTO-FOCUS =====
        searchInput.focus();

        console.log('🚀 Klassik Landing - Public Search Ready');
    </script>
</body>
</html>
