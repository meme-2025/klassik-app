-- PostgreSQL configuration for high-throughput Kaspa blockchain indexing
-- Optimized for 10 BPS (Blocks Per Second) processing

-- Connection and memory settings
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 64MB
maintenance_work_mem = 512MB

-- Write-ahead logging and checkpointing
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = '15min'
max_wal_size = 4GB
min_wal_size = 1GB

-- Query performance
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

-- Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

-- Synchronization (optimized for performance over durability)
synchronous_commit = off
wal_compression = on
wal_log_hints = on

-- Autovacuum tuning for high-write workload
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

-- Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

-- Statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

-- Locale settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

-- Timezone
timezone = 'UTC'