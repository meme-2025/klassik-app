version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: klassik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: klassik_gaming
      POSTGRES_USER: klassik
      POSTGRES_PASSWORD: klassik_dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - klassik-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: klassik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - klassik-network

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: klassik-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: klassik
      DB_PASSWORD: klassik_dev_password_change_in_production
      DB_DATABASE: klassik_gaming
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/node_modules
      - /app/apps/backend/node_modules
    networks:
      - klassik-network
    command: pnpm dev

  # Frontend Web App (Next.js)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: klassik-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - klassik-network
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:

networks:
  klassik-network:
    driver: bridge
