# ============================================
# NGINX REVERSE PROXY CONFIG
# Klassik Backend API Routing
# ============================================

# Add this to your existing nginx config at:
# /etc/nginx/sites-available/klassik.99pace.space

server {
    listen 443 ssl http2;
    server_name klassik.99pace.space;

    # SSL Certificates (existing)
    ssl_certificate /etc/letsencrypt/live/klassik.99pace.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klassik.99pace.space/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend (existing location)
    location / {
        root /var/www/klassik/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ===== NEW: API REVERSE PROXY =====
    location /api/ {
        # Remove /api prefix before proxying
        rewrite ^/api/(.*)$ /$1 break;
        
        # Proxy to backend on port 8130 (internal only)
        proxy_pass http://127.0.0.1:8130;
        
        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forward real client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # CORS Headers (if needed)
        add_header 'Access-Control-Allow-Origin' 'https://klassik.99pace.space' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    # Health check endpoint (optional)
    location /api/health {
        proxy_pass http://127.0.0.1:8130/health;
        access_log off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name klassik.99pace.space;
    return 301 https://$server_name$request_uri;
}
