version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kaspa-postgres
    environment:
      POSTGRES_DB: kaspa
      POSTGRES_USER: kaspa
      POSTGRES_PASSWORD: kaspa_secure_2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaspa-network

  redis:
    image: redis:7-alpine
    container_name: kaspa-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaspa-network

  rest-server:
    build: ./backend/rest-server
    container_name: kaspa-rest-server
    environment:
      KASPAD_HOST: 192.168.2.148
      KASPAD_RPC_PORT: 16110
      PORT: 8081
    ports:
      - "8081:8081"
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  middleware:
    build: ./middleware
    container_name: kaspa-middleware
    environment:
      REST_SERVER_URL: http://localhost:8081
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: kaspa
      POSTGRES_USER: kaspa
      POSTGRES_PASSWORD: kaspa_secure_2024
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8080:8080"
    network_mode: host
    restart: unless-stopped
    depends_on:
      - rest-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:

networks:
  kaspa-network:
    driver: bridge
