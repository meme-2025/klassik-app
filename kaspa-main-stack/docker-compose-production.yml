version: '3.8'

services:
  # PostgreSQL Database - Optimiert für 10 BPS
  postgresql:
    image: postgres:15-alpine
    container_name: kaspa-db
    environment:
      POSTGRES_DB: kaspa_explorer
      POSTGRES_USER: kaspa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaspa_secure_2026}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    restart: unless-stopped
    networks:
      - kaspa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspa_user -d kaspa_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache - High Performance für 10 BPS
  redis:
    image: redis:7-alpine
    container_name: kaspa-redis
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru --tcp-keepalive 60
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - kaspa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kaspa REST Server - Optimiert für hohen Durchsatz
  kaspa-rest-server:
    build:
      context: ./backend/rest-server
      dockerfile: Dockerfile
    container_name: kaspa-rest-api
    environment:
      - KASPA_RPC_HOST=host.docker.internal
      - KASPA_RPC_PORT=16110
      - DATABASE_URL=postgresql://kaspa_user:${POSTGRES_PASSWORD:-kaspa_secure_2026}@postgresql:5432/kaspa_explorer
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - NODE_ENV=production
      - BATCH_SIZE=1000
      - MAX_CONNECTIONS=100
      - WORKER_THREADS=8
    ports:
      - "3000:3000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
    restart: unless-stopped
    networks:
      - kaspa-network
    volumes:
      - ./backend/rest-server/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # High-Performance Middleware für 10 BPS
  kaspa-middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: kaspa-middleware
    environment:
      - KASPA_RPC_HOST=host.docker.internal
      - KASPA_RPC_PORT=16110
      - DATABASE_URL=postgresql://kaspa_user:${POSTGRES_PASSWORD:-kaspa_secure_2026}@postgresql:5432/kaspa_explorer
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - NODE_ENV=production
      - WEBSOCKET_PORT=8080
      - GRPC_MAX_RECEIVE_MESSAGE_LENGTH=104857600
      - GRPC_MAX_SEND_MESSAGE_LENGTH=104857600
      - BATCH_PROCESSING_SIZE=500
      - INDEXING_WORKERS=6
    ports:
      - "4000:4000"
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kaspa-rest-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '6.0'
        reservations:
          memory: 3G
          cpus: '3.0'
    restart: unless-stopped
    networks:
      - kaspa-network
    volumes:
      - ./middleware/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Explorer - Hochperformant
  kaspa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: kaspa-explorer-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://klassik.99pace.space/api
      - NEXT_PUBLIC_WS_URL=wss://klassik.99pace.space/ws
      - NEXT_PUBLIC_NETWORK=mainnet
    ports:
      - "3001:3000"
    depends_on:
      - kaspa-middleware
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - kaspa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy mit Sicherheits-Features
  nginx:
    image: nginx:alpine
    container_name: kaspa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/klassik.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
      - ./nginx/auth:/etc/nginx/auth
    depends_on:
      - kaspa-frontend
      - kaspa-middleware
    networks:
      - kaspa-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: kaspa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - kaspa-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: kaspa-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-klassik2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - kaspa-network
    restart: unless-stopped

  # Node Exporter für System-Metriken
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kaspa-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - kaspa-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  kaspa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16