# Nginx Configuration for Kaspa Explorer
# Domain: klassik.99pace.space

# Upstream servers
upstream kaspa_frontend {
    server frontend:3000;
}

upstream kaspa_api {
    server middleware:8080;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

# Server block
server {
    listen 80;
    listen [::]:80;
    server_name klassik.99pace.space;

    # Redirect HTTP to HTTPS (uncomment when SSL is ready)
    # return 301 https://$server_name$request_uri;

    # For now, serve HTTP
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/kaspa-access.log;
    error_log /var/log/nginx/kaspa-error.log warn;

    # Frontend
    location / {
        proxy_pass http://kaspa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API endpoints with rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        
        # API Key validation (optional - middleware also checks)
        # set $api_key_valid 0;
        # if ($http_x_api_key = "kaspa-elite-2026-key") {
        #     set $api_key_valid 1;
        # }
        # if ($api_key_valid = 0) {
        #     return 401 '{"error":"Unauthorized"}';
        # }

        proxy_pass http://kaspa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
        
        # Preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket endpoint
    location /ws {
        limit_req zone=ws_limit burst=5 nodelay;
        
        proxy_pass http://kaspa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint (no auth)
    location /health {
        proxy_pass http://kaspa_api/api/health;
        access_log off;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://kaspa_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

