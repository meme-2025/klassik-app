# PostgreSQL Configuration für 10 BPS Kaspa Network
# Optimiert für hohen Schreibdurchsatz und Concurrent Reads

# Memory Configuration
shared_buffers = 2GB                    # 25% of available RAM
effective_cache_size = 6GB              # 75% of available RAM
work_mem = 256MB                        # Per query memory
maintenance_work_mem = 512MB
dynamic_shared_memory_type = posix

# Connection Settings
max_connections = 200
superuser_reserved_connections = 3

# WAL (Write-Ahead Logging) - Critical für 10 BPS
wal_buffers = 64MB
wal_writer_delay = 10ms                 # Reduced für bessere Performance
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

# Performance Tuning für High-Frequency Writes
random_page_cost = 1.1                  # SSD optimiert
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Vacuum Settings - Wichtig für kontinuierliche Performance
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 15s               # Häufigeres autovacuum für 10 BPS
autovacuum_vacuum_threshold = 25
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 25
autovacuum_analyze_scale_factor = 0.05

# Logging für Performance Monitoring
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'
log_min_duration_statement = 1000      # Log queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Background Writer - Optimiert für kontinuierliche Schreibvorgänge
bgwriter_delay = 10ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 10.0
bgwriter_flush_after = 256kB

# Query Planner
default_statistics_target = 100
constraint_exclusion = partition
cursor_tuple_fraction = 0.1

# Locale Settings
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Lock Management
deadlock_timeout = 1s
lock_timeout = 30s

# Statement Timeout
statement_timeout = 300s               # 5 minutes für komplexe Queries

# Security
ssl = off                              # Innerhalb Docker-Network
password_encryption = md5

-- Write-ahead logging and checkpointing
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = '15min'
max_wal_size = 4GB
min_wal_size = 1GB

-- Query performance
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

-- Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

-- Synchronization (optimized for performance over durability)
synchronous_commit = off
wal_compression = on
wal_log_hints = on

-- Autovacuum tuning for high-write workload
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

-- Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

-- Statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

-- Locale settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

-- Timezone
timezone = 'UTC'