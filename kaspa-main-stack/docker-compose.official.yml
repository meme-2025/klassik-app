version: '3.8'

networks:
  kaspa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  indexer_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # PostgreSQL Database for Kaspa Indexer
  postgres:
    image: postgres:15
    container_name: kaspa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaspa}
      POSTGRES_USER: ${POSTGRES_USER:-kaspa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaspapass123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.10
    command: [
      "postgres",
      "-c", "shared_preload_libraries=pg_stat_statements",
      "-c", "max_connections=200",
      "-c", "shared_buffers=512MB",
      "-c", "effective_cache_size=1GB",
      "-c", "work_mem=64MB",
      "-c", "maintenance_work_mem=128MB",
      "-c", "random_page_cost=1.1",
      "-c", "wal_buffers=16MB",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "max_wal_size=2GB",
      "-c", "min_wal_size=80MB"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspa"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kaspa Indexer - populates database with blockchain data  
  indexer:
    image: supertypo/simply-kaspa-indexer:latest
    container_name: kaspa_indexer
    restart: always
    environment:
      KASPAD_HOST: ${KASPAD_HOST:-127.0.0.1:16110}
      POSTGRES_URI: postgresql://kaspa:kaspapass123@postgres:5432/kaspa
      KASPA_NETWORK: ${KASPA_NETWORK:-mainnet}
      MIGRATION: "true"
      DEBUG: "false"
      BATCH_SIZE: "1000"
      PARALLEL_WORKERS: "4"
    volumes:
      - indexer_data:/data
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.15
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Official Kaspa REST API Server (Rust - kaspa-ng)
  kaspa-rest-server:
    build:
      context: .
      dockerfile: Dockerfile.kaspa-rest-server
    container_name: kaspa_rest_server
    restart: always
    environment:
      # Kaspad connection
      KASPAD_HOST_1: ${KASPAD_HOST:-127.0.0.1:16110}
      KASPAD_WRPC_URL: ${KASPAD_WRPC_URL:-ws://127.0.0.1:16110}
      
      # Database configuration
      SQL_URI: postgresql+asyncpg://kaspa:kaspapass123@postgres:5432/kaspa
      SQL_POOL_SIZE: "25"
      SQL_POOL_MAX_OVERFLOW: "10"
      SQL_POOL_RECYCLE_SECONDS: "1800"
      
      # Network settings
      NETWORK_TYPE: ${NETWORK_TYPE:-mainnet}
      BPS: "10"
      
      # Feature flags
      DISABLE_PRICE: "false"
      USE_SCRIPT_FOR_ADDRESS: "false" 
      PREV_OUT_RESOLVED: "false"
      TX_SEARCH_ID_LIMIT: "1000"
      TX_SEARCH_BS_LIMIT: "100"
      VSPC_REQUEST: "false"
      TRANSACTION_COUNT: "true"
      ADDRESSES_ACTIVE_COUNT: "true"
      HASHRATE_HISTORY: "true"
      ADDRESS_RANKINGS: "false"
      
      # Health check settings
      HEALTH_TOLERANCE_DOWN: "300"
      
      # Logging
      DEBUG: "false"
    ports:
      - "8000:8000"  # Changed from 8080 to avoid conflicts
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.20
    depends_on:
      postgres:
        condition: service_healthy
      indexer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Official Kaspa Explorer Frontend (Next.js - kaspa-ng)
  kaspa-explorer:
    build:
      context: .
      dockerfile: Dockerfile.kaspa-explorer
      args:
        API_URL: https://klassik.99pace.space/api
        WEBSOCKET_URL: wss://klassik.99pace.space/ws
    container_name: kaspa_explorer
    restart: always
    environment:
      REACT_APP_API_URL: https://klassik.99pace.space/api
      REACT_APP_WS_URL: wss://klassik.99pace.space/ws
      NODE_ENV: production
    ports:
      - "3002:80"  # Changed from 3000 to avoid conflicts
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.25
    depends_on:
      kaspa-rest-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: kaspa_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.30
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=0.0.0.0:9090'
    depends_on:
      - kaspa-rest-server

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: kaspa_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.31
    depends_on:
      - prometheus

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kaspa_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/kaspa-ng-main.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.40
    depends_on:
      - kaspa-explorer
      - kaspa-rest-server
      - grafana
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3