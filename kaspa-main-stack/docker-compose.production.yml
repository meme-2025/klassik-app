version: '3.8'

# Production Kaspa Full-Stack - Optimized for 10 BPS Crescendo
services:
  
  # PostgreSQL - Optimized for high-throughput indexing
  postgres:
    image: postgres:15-alpine
    container_name: kaspa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kaspa-backend

  # Redis - High-speed cache
  redis:
    image: redis:7-alpine
    container_name: kaspa-redis
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kaspa-backend

  # REST Server - Direct kaspad adapter
  rest-server:
    build:
      context: ./backend/rest-server
      dockerfile: Dockerfile
    container_name: kaspa-rest-server
    environment:
      KASPAD_HOST: ${KASPAD_HOST}
      KASPAD_RPC_PORT: ${KASPAD_RPC_PORT}
      PORT: ${BACKEND_PORT}
      NODE_ENV: production
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Middleware - Indexing + API layer
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: kaspa-middleware
    environment:
      REST_SERVER_URL: http://localhost:${BACKEND_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: ${MIDDLEWARE_PORT}
      NODE_ENV: production
      BATCH_SIZE: 100
      BATCH_INTERVAL_MS: 500
    network_mode: host
    restart: unless-stopped
    depends_on:
      - rest-server
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: kaspa-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: unless-stopped
    networks:
      - kaspa-backend

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: kaspa-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/kaspa.json
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kaspa_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/klassik.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
    networks:
      kaspa-net:
        ipv4_address: 172.20.0.40
    depends_on:
      - kaspa-explorer
      - kaspa-rest-server
      - grafana
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kaspa-backend

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kaspa-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
