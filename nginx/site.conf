# Production site configuration for klassik.99pace.space
# Kaspa Full-Stack Application with SSL/TLS

upstream kaspa_backend {
    server kaspa-backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream kaspa_frontend {
    server kaspa-frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream grafana {
    server kaspa-grafana:3000 max_fails=3 fail_timeout=30s;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=2r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name klassik.99pace.space www.klassik.99pace.space;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name klassik.99pace.space;

    # SSL configuration (certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/klassik.99pace.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klassik.99pace.space/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/klassik.99pace.space/chain.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/kaspa_access.log;
    error_log /var/log/nginx/kaspa_error.log;

    # API endpoints - direct to middleware
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend_middleware/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket support for real-time updates
    location /ws {
        proxy_pass http://backend_middleware;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Grafana dashboard (protected)
    location /monitoring/ {
        auth_basic "Kaspa Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://backend_middleware/health;
        access_log off;
    }

    # Static frontend files
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        
        root /var/www/kaspa-frontend;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
