<!DOCTYPE html>
<html>
<head>
    <title>Live Site Tester</title>
</head>
<body>
    <h1>Testing klassik.99pace.space APIs</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testAPI() {
            const tests = [
                { name: 'Health Check', url: 'https://klassik.99pace.space/api/health' },
                { name: 'Kaspa Stats', url: 'https://klassik.99pace.space/api/kaspa-enhanced/stats' },
                { name: 'Latest Blocks', url: 'https://klassik.99pace.space/api/kaspa-enhanced/blocks/latest?limit=10' },
                { name: 'CoinGecko Price', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.coingecko.com/api/v3/simple/price?ids=kaspa&vs_currencies=usd&include_24hr_change=true&include_market_cap=true&include_24hr_vol=true') }
            ];
            
            for (const test of tests) {
                const div = document.createElement('div');
                div.innerHTML = `<h3>${test.name}</h3>`;
                
                try {
                    const response = await fetch(test.url);
                    const data = await response.json();
                    div.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    div.style.background = '#d4edda';
                    div.style.padding = '10px';
                    div.style.margin = '10px';
                } catch (error) {
                    div.innerHTML += `<p style="color: red;">ERROR: ${error.message}</p>`;
                    div.style.background = '#f8d7da';
                    div.style.padding = '10px';
                    div.style.margin = '10px';
                }
                
                results.appendChild(div);
            }
        }
        
        testAPI();
    </script>
</body>
</html>
